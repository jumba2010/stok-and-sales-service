spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB_NAME:stock_pos}
    username: ${MYSQL_USER:stock_pos}
    password: ${MYSQL_PASSWORD:stock_pos}
  jpa:
    show-sql: ${SHOW_SQL:false}
    hibernate:
      ddl-auto: none   # schema is owned by Flyway migrations
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5Dialect
  # Flyway must live directly under "spring" - it was previously nested under
  # "spring.jpa", which Spring Boot silently ignored.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
    locations: classpath:db/migration
